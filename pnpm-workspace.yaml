# pnpm-workspace.yaml — the JS dependency universe (PHILOSOPHY "Package management model":
# ONE root pnpm workspace, ONE pnpm-lock.yaml, hoisted node_modules, single pnpm install).
#
# Under pnpm 11 this file ALSO holds the pnpm settings that used to live in .npmrc
# (relocated as camelCase keys — see .npmrc). Auth/registry lines stay in .npmrc.

# --- pnpm settings (pnpm 11; camelCase) ---
# Key design ruling #6: pnpm + Expo/Metro requires the HOISTED node-linker (flat node_modules
# is the documented Expo happy path). Never set disableHierarchicalLookups — metro's
# nodeModulesPaths walk depends on hierarchical lookup working.
nodeLinker: hoisted

# Keep the lockfile authoritative + installs reproducible across machines and CI. (pnpm also
# auto-enables frozen-lockfile in CI, and pnpm 11 fails a CI install if the lockfile was written
# by a NEWER pnpm major — so keep the pnpm major aligned across dev/CI.)
preferFrozenLockfile: true

# Build-script allowlist. pnpm blocks dependency lifecycle (build) scripts by default; pnpm 11
# replaced the old `only-built-dependencies` API with this `allowBuilds` map (package → boolean).
# Empty in Phase 1; add entries as Phase 2+ introduces native tooling that needs a build step:
#   allowBuilds:
#     esbuild: true
allowBuilds:
  esbuild: true # postinstall places the platform esbuild binary (vite/storybook toolchain)
  lefthook: true # postinstall places the lefthook binary (needed for `pnpm prepare` hook install)
  electron: true # postinstall downloads the Electron binary (desktop shell)
  electron-winstaller: true # electron-builder dep; postinstall fetches its Squirrel tooling
  "@sentry/cli": true # postinstall fetches the sentry-cli binary (source-map upload at build time)

# --- workspace globs ---
packages:
  - "packages/*"
  # Each product is THREE JS workspaces + a generated client (PHILOSOPHY ruling #1):
  - "products/*/app"
  - "products/*/desktop"
  - "products/*/api" # script-shim package.json → uv run (PHILOSOPHY "Package management model")
  - "products/*/api-client" # generated + committed (hey-api)

# eslint-plugin-react-hooks 7.x declares `zod-validation-error@^3.5.0 || ^4.0.0` but imports the
# `zod-validation-error/v4` subpath, which only EXISTS in the 4.x line — resolving the ^3.5.0 arm
# (a legal pick) crashes every lint run with ERR_PACKAGE_PATH_NOT_EXPORTED. Scoped to the plugin so
# @figma/code-connect keeps its own 3.x resolution; drop this when the plugin fixes its range.
overrides:
  "eslint-plugin-react-hooks>zod-validation-error": ^4.0.2
  # CVE-2026-59870 (quadratic CPU in !!omap/merge-key resolution) is fixed in js-yaml 4.3.1, but
  # @hey-api/json-schema-ref-parser pins =4.2.0 and electron-updater dedupes onto it. Scoped to the
  # 4.x line so the 3.15.x consumers keep their own (already-patched) resolution.
  "js-yaml@4": ^4.3.1

patchedDependencies:
  app-builder-lib@26.15.7: patches/app-builder-lib@26.15.7.patch
