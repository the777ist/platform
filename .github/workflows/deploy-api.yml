# PHILOSOPHY Workflows / Releases (trunk-based): main → staging, tag <product>-api-v* →
# that product's production. Alembic runs as the Fly release_command over the direct
# 5432 DATABASE_MIGRATION_URL (Key ruling #4) — NOT a CI step. All secrets/app names
# are clearly-marked placeholders (org placeholder `example`) until real infra exists.
name: Deploy API
on:
  push:
    branches: [main] # → staging
    tags: ["*-api-v*"] # <product>-api-v* → production
# Least privilege for GITHUB_TOKEN. The repo default is currently `read`, but that is a repo
# SETTING someone can change; declaring it here makes the guarantee travel with the workflow.
# Nothing in these jobs writes to this repo (deploys authenticate with their own secrets).
permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      products: ${{ steps.select.outputs.products }}
      has-fly-token: ${{ steps.secret-gate.outputs.has-fly-token }}
    steps:
      - uses: actions/checkout@v6
      - name: Derive per-product path filters
        id: gen
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        # Derived from products/* so a newly stamped product is covered the moment it exists. The
        # hardcoded roster that used to live here meant a new product silently never deployed until
        # somebody remembered to edit BOTH workflows. Plain node: builtins only, no install needed.
        run: |
          {
            echo "filters<<PRODUCT_FILTERS_EOF"
            node scripts/product-filters.mjs api
            echo "PRODUCT_FILTERS_EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: dorny/paths-filter@v4
        id: filter
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          filters: ${{ steps.gen.outputs.filters }}
      - name: Select the products to deploy
        id: select
        env:
          CHANGED: ${{ steps.filter.outputs.changes }}
        run: |
          # A push to main deploys whatever CHANGED, to staging. A tag deploys the ONE product the
          # tag names, to production — the product is in the tag (`<product>-api-v*`), so deriving
          # it from a path diff is both unnecessary and wrong: paths-filter compares a tag against
          # the default branch, and a release tag normally points AT main's head, so the diff is
          # empty, `changes` is `[]`, and the deploy job is skipped. Production would simply never
          # ship, with a green tick on the run. eas-build.yml and electron-release.yml already
          # parse the tag; this workflow was the only one that did not.
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            product="${GITHUB_REF_NAME%%-api-v*}"
            if [ "$product" = "template" ]; then dir="_template"; else dir="$product"; fi
            # Fail here rather than letting flyctl run in a directory that does not exist: a typo
            # in a release tag is otherwise a confusing failure deep inside the deploy step.
            if [ ! -d "products/$dir/api" ]; then
              echo "::error::tag '$GITHUB_REF_NAME' names product '$product', but products/$dir/api does not exist"
              exit 1
            fi
            echo "products=[\"$product\"]" >> "$GITHUB_OUTPUT"
          else
            echo "products=$CHANGED" >> "$GITHUB_OUTPUT"
          fi
      # `secrets` isn't readable in a job-level `if`, so surface the gate as an output:
      # until FLY_API_TOKEN is configured (real infra day), deploy SKIPS green instead
      # of failing against the placeholder Fly apps.
      - name: Secret gate
        id: secret-gate
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: echo "has-fly-token=$([[ -n "$FLY_API_TOKEN" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
  deploy:
    needs: changes
    if: ${{ needs.changes.outputs.products != '[]' && needs.changes.outputs.has-fly-token == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        product: ${{ fromJSON(needs.changes.outputs.products) }}
    steps:
      - uses: actions/checkout@v6
      # Pinned to a release, not @master: this job holds FLY_API_TOKEN, and a moving branch
      # means whatever that branch becomes runs with the deploy credential.
      - uses: superfly/flyctl-actions/setup-flyctl@v1.4
      - name: Deploy (staging on main, production on tag)
        working-directory: products/${{ matrix.product == 'template' && '_template' || matrix.product }}/api
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }} # PLACEHOLDER secret
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            flyctl deploy -c fly.production.toml --remote-only
          else
            flyctl deploy -c fly.staging.toml --remote-only
          fi
