# PHILOSOPHY Workflows: mise-action → pnpm frozen install → uv sync (affected apis) →
# turbo lint/typecheck/test/build/openapi --affected → typegen drift check.
# The drift check is the contract guard: a stale openapi.json or generated client
# makes `git diff --exit-code` non-zero and fails CI.
name: CI
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
# Least privilege for GITHUB_TOKEN. The repo default is currently `read`, but that is a repo
# SETTING someone can change; declaring it here makes the guarantee travel with the workflow.
# Nothing in these jobs writes to this repo (deploys authenticate with their own secrets).
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres: # real Postgres for API integration tests (testing strategy)
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready" --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # turbo --affected needs history for the base diff
      - uses: jdx/mise-action@v4 # installs Node 24 / pnpm 11 / Python 3.13 / uv from mise.toml
        # v4 = Node-24 action runtime (Node 20 is EOL on GH runners)
      - run: pnpm install --frozen-lockfile
      - name: Prettier (whole repo — deliberately NOT affected-scoped)
        # Every turbo task's `inputs` exclude **/*.md and **/docs/**, so a docs-only PR
        # legitimately selects ZERO tasks — without this step it would land with no CI
        # checks at all. Formatting is otherwise enforced only by the lefthook pre-commit
        # hook, which `--no-verify` and a broken hook env both bypass.
        run: pnpm run format:check
      - name: ESLint (root-owned files no package covers)
        # scripts/ and the root *.config.mjs belong to no workspace package, so `turbo run lint`
        # never reaches them — including the gate scripts themselves. Same script the pre-push hook
        # calls, so the two cannot diverge on flags or config resolution.
        run: pnpm run lint:root
      - name: Tests for the gate scripts themselves
        # affected.mjs decides what this workflow checks; if it returned an empty scope, turbo
        # would run nothing and this job would still be green. The enforcer needs enforcing.
        run: pnpm run test:scripts
      - name: Focused tests + stamped tokens + secrets + semantic tokens
        # Both are FALSE-GREEN guards: a stray `.only` makes a suite pass having run almost
        # nothing, and an embedded template token makes a stamped product carry the template's
        # names. Playwright has forbidOnly in CI; Jest has no such flag, hence the explicit check.
        run: |
          node scripts/check-focused-tests.mjs
          node scripts/check-stamp-tokens.mjs
          node scripts/check-committed-secrets.mjs
          node scripts/check-semantic-tokens.mjs
      - name: commitlint (the commit-msg hook is bypassable)
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          # A gate that runs ONLY in a hook is not enforced: --no-verify skips it. Merge commits are
          # ignored by commitlint's defaults. An unresolvable base (first push / force-push) skips
          # rather than fails, since there is no range to judge.
          if git rev-parse --verify --quiet "$BASE^{commit}" >/dev/null; then
            pnpm exec commitlint --from "$BASE" --to "$HEAD" --verbose
          else
            echo "base '$BASE' is not resolvable — skipping commit-message lint"
          fi
      - name: Deploy path filters generate cleanly
        run: |
          # deploy-api.yml / eas-update.yml derive their per-product path filters from this script,
          # but those workflows only run on push-to-main and on tags -- so it would otherwise go
          # unexercised on Linux until the moment a deploy depends on it. Prove it here, where a
          # failure is a red PR check instead of a broken deploy.
          for surface in api app; do
            out=$(node scripts/product-filters.mjs "$surface")
            expected=$(find products -mindepth 2 -maxdepth 2 -type d -name "$surface" | wc -l)
            actual=$(echo "$out" | grep -c . || true)
            echo "$surface: $actual filter line(s) for $expected product(s)"
            echo "$out"
            if [ "$actual" != "$expected" ]; then
              echo "::error::product-filters emitted $actual lines for $expected products"
              exit 1
            fi
          done
      - name: Resolve affected scope
        id: scope
        env:
          # Explicit base/head so scoping survives squash-merge histories: PR base sha on
          # pull_request, the pushed-from sha on push to main.
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          # scripts/affected.mjs is the SAME module the pre-push hook uses, so the hook and CI can
          # never disagree about what a change affects. Empty output means "select everything" —
          # emitted when a global input (tsconfig.base.json, eslint.config.mjs, ...) changed, or
          # when the base is not a resolvable commit. NOTE: `--affected` is deliberately not used
          # here; it is mutually exclusive with `--filter` and cannot express either escalation.
          # Assigned first, THEN echoed: `echo "x=$(cmd)"` hides a crash because echo succeeds,
          # so a broken resolver would look like "no filter" and quietly pass for a different
          # reason than it should. A plain assignment trips `set -e`.
          filter=$(node scripts/affected.mjs scope "$BASE" "$HEAD")
          echo "filter=$filter" >> "$GITHUB_OUTPUT"
          # The task list comes from the same module the hook imports, so a task can never be added
          # to one tier and silently missed by the other.
          echo "tasks=$(node scripts/affected.mjs tasks)" >> "$GITHUB_OUTPUT"
          node scripts/affected.mjs apis "$BASE" "$HEAD" > "$RUNNER_TEMP/affected-apis.txt"
          echo "affected APIs:"; cat "$RUNNER_TEMP/affected-apis.txt"; echo
      - name: uv sync (affected APIs only)
        run: |
          # Only the products actually in play. Looping every products/*/api costs one venv sync per
          # product on every PR — a bill that grows with the product count and buys nothing.
          while read -r api; do
            [ -n "$api" ] || continue
            echo "-> uv sync $api"
            uv sync --frozen --project "$api"
          done < "$RUNNER_TEMP/affected-apis.txt"
      - name: Alembic single-head check (affected APIs)
        run: |
          # Same checker the pre-push hook runs. `alembic heads` reads the migration directory only
          # -- no database -- and two heads mean two branches each added a migration.
          if [ -s "$RUNNER_TEMP/affected-apis.txt" ]; then
            node scripts/alembic-heads.mjs $(cat "$RUNNER_TEMP/affected-apis.txt")
          else
            echo "no affected APIs — skipping the alembic head check"
          fi
      - name: Lint / typecheck / test / build / openapi (affected only)
        env:
          SCOPE: ${{ steps.scope.outputs.filter }}
          TASKS: ${{ steps.scope.outputs.tasks }}
        run: |
          # Passed via env, not interpolated into the command, and quoted only when non-empty: the
          # filter contains [ ] that bash would glob, and an empty "" is not the same as no argument.
          # An empty task list would make `turbo run` a no-op that still exits 0 -- the exact
          # "gate that silently does nothing" this pipeline is built to avoid. Fail loudly instead.
          [ -n "$TASKS" ] || { echo "::error::affected.mjs returned an empty task list"; exit 1; }
          echo "tasks: $TASKS"
          if [ -n "$SCOPE" ]; then
            pnpm turbo run $TASKS "$SCOPE"
          else
            pnpm turbo run $TASKS
          fi
      - name: Typegen drift check
        run: |
          git diff --exit-code products/*/api-client products/*/api/openapi.json
