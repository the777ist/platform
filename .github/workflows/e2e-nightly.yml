# PHILOSOPHY Testing strategy: web E2E (full stack) + Storybook visual regression,
# both NIGHTLY + workflow_dispatch. Two independent jobs so a VR diff doesn't mask
# an E2E failure (and vice versa). VR baselines are committed; a diff fails the job.
name: E2E Nightly
on:
  schedule:
    - cron: "0 4 * * *" # nightly 04:00 UTC
  workflow_dispatch: # on-demand (the Verify path)
    inputs:
      update-vr-baselines:
        description: "Regenerate the linux VR baselines on this runner and upload them as an artifact (instead of asserting)"
        type: boolean
        default: false
# Least privilege for GITHUB_TOKEN. The repo default is currently `read`, but that is a repo
# SETTING someone can change; declaring it here makes the guarantee travel with the workflow.
# Nothing in these jobs writes to this repo (deploys authenticate with their own secrets).
permissions:
  contents: read

jobs:
  # Which products get E2E — derived from products/*, so a newly stamped product is covered the
  # night it lands with no workflow edit. This job exists because the E2E used to be hardcoded to
  # `products/_template`: the stamp SOURCE was the only thing ever tested and no shipped product
  # was. `_template` stays in the list deliberately — it is what every future product is stamped
  # from, so a break there is born into all of them.
  products:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      list: ${{ steps.list.outputs.products }}
    steps:
      - uses: actions/checkout@v6
      - id: list
        run: |
          json=$(ls -d products/*/app 2>/dev/null | cut -d/ -f2 | jq -R -s -c 'split("\n")|map(select(length>0))')
          [ -n "$json" ] || json='[]'
          echo "products=$json" >> "$GITHUB_OUTPUT"
          echo "products with a web app: $json"
  web-e2e:
    needs: products
    if: ${{ needs.products.outputs.list != '[]' }}
    strategy:
      fail-fast: false # one product's failure must never hide another product's result
      matrix:
        product: ${{ fromJSON(needs.products.outputs.list) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres: # the API's DB (auth/realtime come from the Supabase CLI stack below)
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      # The playwright global-setup starts this product's local Supabase stack and the api
      # webServer reads these (no .env in CI). SUPABASE_URL is NOT here: the Supabase block is
      # offset per product, so it is derived below.
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
      DATABASE_MIGRATION_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
      # The Supabase CLI's shared LOCAL demo service_role JWT (public by design).
      SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
      - uses: supabase/setup-cli@v1 # global-setup runs `supabase start`
        with: { version: latest }
      - run: pnpm install --frozen-lockfile
      - run: uv sync --frozen --project products/${{ matrix.product }}/api
      - run: pnpm exec playwright install --with-deps chromium
      - name: Resolve this product's Supabase URL
        # READ from the product's supabase/config.toml, never recomputed from
        # `54321 + 100*portIndex`. The generator owns that formula and writes the result into
        # config.toml; recomputing it here is a second copy that can disagree with the file the
        # CLI actually reads. On a runner that is one wasted `supabase start`; the shape that
        # matters is a URL pointing at a DIFFERENT product's stack, which the suite would happily
        # sign up against. (Hardcoding :54321 is what pinned this workflow to _template.)
        env:
          PRODUCT: ${{ matrix.product }}
        run: |
          port=$(node -e "
            const fs = require('fs');
            const cfg = fs.readFileSync('products/' + process.env.PRODUCT + '/supabase/config.toml', 'utf8');
            const section = cfg.split(/^\[/m).find((s) => s.startsWith('api]'));
            const m = section && section.match(/^\s*port\s*=\s*(\d+)/m);
            if (!m) { console.error('no [api] port in config.toml'); process.exit(1); }
            console.log(m[1]);
          ")
          echo "SUPABASE_URL=http://localhost:$port" >> "$GITHUB_ENV"
          echo "$PRODUCT: supabase/config.toml [api] port=$port"
      - name: Web E2E (signup → login → CRUD → realtime)
        # Filtered by PATH, not by `@<scope>/<product>-app`: a path filter survives a repo/org
        # rename, which the scoped name does not.
        run: pnpm --filter ./products/${{ matrix.product }}/app exec playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          # Unique per matrix job — upload-artifact v4 rejects duplicate names outright.
          name: web-e2e-report-${{ matrix.product }}
          path: products/${{ matrix.product }}/app/test-results/
          if-no-files-found: ignore # a pre-test failure produces no results dir
  visual-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Build Storybook
        run: pnpm --filter @platform/ui build-storybook
      - name: Visual regression (each story × light/dark vs committed baselines)
        if: ${{ !inputs.update-vr-baselines }}
        run: pnpm --filter @platform/ui exec playwright test
      # Baselines are per-platform (font rendering differs across OSes) — the linux set
      # must be generated on THIS runner: dispatch with `update-vr-baselines: true`,
      # download the artifact, commit it under the snapshots dir.
      - name: Regenerate linux VR baselines (dispatch opt-in)
        if: ${{ inputs.update-vr-baselines }}
        run: pnpm --filter @platform/ui exec playwright test --update-snapshots
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.update-vr-baselines }}
        with:
          name: vr-baselines-linux
          path: packages/ui/.storybook/visual-regression.spec.ts-snapshots/*-linux.png
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-regression-diffs
          path: packages/ui/test-results/
          if-no-files-found: ignore # a pre-test failure produces no results dir
